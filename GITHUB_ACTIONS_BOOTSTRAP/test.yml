name: Test and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone exact revision without third-party checkout action
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
      - name: Run offline tests
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          node --check search.js
          node --check academic.js
          node --check legislation.js
          node --check xlsx-export.js
          node --check ai-engine.js
          node --check app.js
          node tests/search_quality.test.js
          node tests/academic_quality.test.js
          node tests/legislation_xlsx.test.js
          python3 -m py_compile backend/hf-space/app.py
          python3 scripts/build_search_index.py
          python3 scripts/build_site.py
          python3 scripts/check_site.py
          python3 scripts/sbom.py
