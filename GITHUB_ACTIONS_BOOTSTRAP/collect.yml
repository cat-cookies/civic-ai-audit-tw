name: Contract-test official APIs
on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * 2"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init . && git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${SHA}" && git checkout --detach FETCH_HEAD
      - name: Test documented public endpoints
        continue-on-error: true
        run: python3 scripts/collect.py --limit 5
      - name: Preserve status only in job log
        run: cat data/connector-status.json
